name: Image build

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
      - 'scripts/**'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch releases and generate matrix
        id: set-matrix
        run: python .github/scripts/generate_matrix.py

  build:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check if rebuild is required
        id: check
        env:
          REF: ${{ matrix.build.ref }}
          MATRIX_TAGS: ${{ toJSON(matrix.build.tags) }}
        run: bash .github/scripts/check_rebuild.sh

      - name: Set up QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: BRANCH=${{ matrix.build.ref }}
          tags: ${{ steps.check.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ env.BUILD_REVISION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
