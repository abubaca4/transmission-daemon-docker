name: Image build

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Fetch releases and generate matrix
        id: set-matrix
        run: |
          python -c '
          import urllib.request, json, os

          req = urllib.request.Request("https://api.github.com/repos/transmission/transmission/releases")
          req.add_header("User-Agent", "GitHub-Actions")

          with urllib.request.urlopen(req) as response:
              releases = json.loads(response.read().decode())

          stable = next((r for r in releases if not r["prerelease"]), None)
          latest = releases[0] if releases else None

          builds = {}
          def add_build(ref, tag):
              if ref not in builds: builds[ref] = []
              builds[ref].append(tag)

          add_build("main", "main")

          if stable:
              add_build(stable["tag_name"], stable["tag_name"])
              add_build(stable["tag_name"], "latest")

          if latest:
              add_build(latest["tag_name"], latest["tag_name"])
              add_build(latest["tag_name"], "latest-include-beta")

          matrix = [{"ref": ref, "tags": list(set(tags))} for ref, tags in builds.items()]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          '

  build:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if rebuild is required
        id: check
        run: |
          REF="${{ matrix.build.ref }}"
          PRIMARY_TAG=$(echo '${{ toJSON(matrix.build.tags) }}' | jq -r '.[0]')
          IMAGE_URL="docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PRIMARY_TAG}"
          IMAGE_URL=$(echo "$IMAGE_URL" | tr '[:upper:]' '[:lower:]')

          UPSTREAM_SHA=$(curl -sL -H "User-Agent: GitHub-Actions" \
            "https://api.github.com/repos/transmission/transmission/commits/$REF" | jq -r '.sha')

          if [ "$UPSTREAM_SHA" == "null" ] || [ -z "$UPSTREAM_SHA" ]; then
            echo "Failed to fetch upstream commit for $REF"
            exit 1
          fi

          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV

          IMAGE_BASE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          FULL_TAGS=""
          for tag in $(echo '${{ toJSON(matrix.build.tags) }}' | jq -r '.[]'); do
            FULL_TAGS="${FULL_TAGS}${IMAGE_BASE}:${tag},"
          done
          echo "tags=${FULL_TAGS%,}" >> $GITHUB_OUTPUT

          if ! skopeo inspect "$IMAGE_URL" > image_info.json 2>/dev/null; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Reason: Image not found in registry."
            exit 0
          fi

          IMAGE_SHA=$(jq -r '.Labels["org.opencontainers.image.revision"] // empty' image_info.json)
          CREATED=$(jq -r '.Created // empty' image_info.json)

          if [ "$IMAGE_SHA" != "$UPSTREAM_SHA" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Reason: Upstream commit changed ($IMAGE_SHA -> $UPSTREAM_SHA)."
            exit 0
          fi

          if [ -n "$CREATED" ]; then
            CREATED_TS=$(date -d "$CREATED" +%s)
            NOW_TS=$(date +%s)
            AGE=$((NOW_TS - CREATED_TS))
            if [ $AGE -gt 604800 ]; then # 7 дней
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "Reason: Image is older than 7 days."
              exit 0
            fi
          fi

          echo "should_build=false" >> $GITHUB_OUTPUT
          echo "Reason: Image is up to date."

      - name: Set up QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BRANCH=${{ matrix.build.ref }}
          tags: ${{ steps.check.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
